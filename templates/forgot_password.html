<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef2ff;
            color: #1f2937;
        }
        .page-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .forgot-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.08);
            padding: 30px;
        }
        .forgot-card h1 {
            margin: 0 0 12px;
            font-size: 24px;
            color: #1f5e5f;
        }
        .forgot-card p {
            margin: 0 0 24px;
            line-height: 1.7;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d7e2e2;
            border-radius: 8px;
            font-size: 15px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2C7A7B;
            box-shadow: 0 0 0 3px rgba(44, 122, 123, 0.12);
        }
        .btn-submit {
            width: 100%;
            display: inline-block;
            text-align: center;
            background: #2C7A7B;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-submit:hover {
            background: #1f5e5f;
        }
        .link-row {
            margin-top: 18px;
            text-align: center;
        }
        .link-row a {
            color: #2C7A7B;
            text-decoration: none;
            font-weight: 600;
        }
        .link-row a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="forgot-card">
            <h1>Forgot Password</h1>
            <p>Enter your email address below and we will send a password reset link to your inbox.</p>
            <form action="{{ url_for('auth.forgot_password') }}" method="post">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required />
                </div>
                <button type="submit" class="btn-submit">Send Reset Link</button>
            </form>
            <div class="link-row">
                <a href="{{ url_for('admin_dashboard.admin_dashboard') }}">Back to Admin Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
