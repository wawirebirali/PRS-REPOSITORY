<!DOCTYPE html>
<html lang="en">
<head>
<button class="back-btn" onclick="goToDashboard()">
    ⬅ Back to Dashboard
</button>
<meta charset="UTF-8">
<title>Quotation Request Form</title>

<style>
body{
    font-family:Arial;
    background:#eef2f7;
    padding:20px;
}

.container{
    background:#fff;
    max-width:1000px;
    margin:auto;
    padding:25px;
    border-radius:10px;
}

label{font-weight:bold; display:block; margin-top:10px;}

input, select{
    width:100%;
    padding:10px;
    margin:5px 0 15px;
    box-sizing:border-box;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#2c7a7b;
    color:white;
}

button{
    padding:10px;
    border:none;
    cursor:pointer;
}

.add-btn{background:green;color:white;}
.submit-btn{background:blue;color:white;}
.remove-btn{background:red;color:white;}

.back-btn {
    padding: 10px 18px;
    background-color: #2C7A7B;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-family: Arial, sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.back-btn:hover {
    background-color: #1f5e5f;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.back-btn:active {
    transform: scale(0.97);
}
</style>
</head>

<body>

<div class="container">

<h2>Quotation Request Form</h2>

<!-- CREATED BY -->
<label>Created By</label>
<input type="text" id="created_by" value="{{ created_by }}" readonly>

<!-- DATE -->
<label>Submission Date</label>
<input type="date" id="submission_date">

<!-- QRF -->
<label>QRF Number</label>
<input type="text" id="qrf_no" readonly>

<!-- PRS -->
<label>PRS</label>
<select id="requisition_id">
    <option value="">-- Select PRS --</option>
    {% for prs in requisitions %}
        <option value="{{ prs.requisition_id }}">{{ prs.prs_no }}</option>
    {% endfor %}
</select>

<!-- SUPPLIER -->
<label>Supplier</label>
<select id="supplier_id">
    <option value="">-- Select Supplier --</option>
    {% for supplier in suppliers %}
        <option value="{{ supplier.supplier_id }}">{{ supplier.supplier_name }}</option>
    {% endfor %}
</select>

<h3>Items</h3>

<table>
<thead>
<tr>
    <th>Material</th>
    <th>Description</th>
    <th>Qty</th>
    <th>UOM</th>
    <th>Action</th>
</tr>
</thead>

<tbody id="itemsBody"></tbody>
</table>

<br>

<button type="button" class="add-btn" onclick="addRow()">Add Item</button>
<button type="button" class="submit-btn" onclick="submitForm()">Save QRF</button>

</div>

<script>

// ===============================
// UOM LIST (20 OPTIONS)
// ===============================
const uoms = [
    "pcs","kg","g","mg","ltr","ml","box","pack","bag","bottle",
    "roll","ream","sheet","pair","set","dozen","bundle","meter","cm","sqm"
];

// ===============================
// PAGE LOAD
// ===============================
window.onload = function(){
    document.getElementById("submission_date").value =
        new Date().toISOString().split("T")[0];

    generateQRF();
    addRow();
};

// ===============================
// QRF GENERATOR
// ===============================
function generateQRF(){

    let year = new Date().getFullYear();
    let counter = localStorage.getItem("qrf_counter") || 0;

    counter = parseInt(counter) + 1;
    localStorage.setItem("qrf_counter", counter);

    document.getElementById("qrf_no").value =
        `QRF/${year}/${String(counter).padStart(4,"0")}`;
}

// ===============================
// ADD ROW
// ===============================
function addRow(){

    let tbody = document.getElementById("itemsBody");

    let uomOptions = uoms.map(u =>
        `<option value="${u}">${u.toUpperCase()}</option>`
    ).join("");

    let row = document.createElement("tr");

    row.innerHTML = `
        <td><input class="material" placeholder="Material"></td>
        <td><input class="desc" placeholder="Description"></td>
        <td><input type="number" class="qty" value="1" min="1"></td>

        <td>
            <select class="uom">
                ${uomOptions}
            </select>
        </td>

        <td>
            <button type="button" class="remove-btn" onclick="removeRow(this)">
                X
            </button>
        </td>
    `;

    tbody.appendChild(row);
}

// ===============================
// REMOVE ROW
// ===============================
function removeRow(btn){
    btn.closest("tr").remove();

    if(document.querySelectorAll("#itemsBody tr").length === 0){
        addRow();
    }
}

// ===============================
// SUBMIT FORM
// ===============================
function submitForm(){

    let items = [];

    document.querySelectorAll("#itemsBody tr").forEach(row => {

        let material = row.querySelector(".material").value;
        let desc = row.querySelector(".desc").value;
        let qty = row.querySelector(".qty").value;
        let uom = row.querySelector(".uom").value;

        if(material){
            items.push({
                item: material,
                description: desc,
                qty: qty,
                uom: uom
            });
        }
    });

    fetch("/procurement/save_qrf", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            qrf_no: document.getElementById("qrf_no").value,
            requested_by: document.getElementById("created_by").value,
            submission_date: document.getElementById("submission_date").value,
            requisition_id: document.getElementById("requisition_id").value,
            supplier_id: document.getElementById("supplier_id").value,
            items: items
        })
    })
    .then(r => r.json())
    .then(data => {
        if(data.success){
            alert(data.message);
            window.location.href = data.redirect;
        } else {
            alert(data.message);
        }
    })
    .catch(err => {
        console.log(err);
        alert("Server error");
    });
}


function goToDashboard() {
    window.location.href = "{{ url_for('procurement_dashboard.procurement_dashboard') }}";
}

</script>

</body>
</html>
