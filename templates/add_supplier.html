<!DOCTYPE html>
<html>
<head>
<button class="back-btn" onclick="goToDashboard()">
    ⬅ Back to Dashboard
</button>
    
    <title>Add Supplier</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#eef2f7;
            padding:30px;
        }

        .container{
            max-width:800px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        h2{
            color:#2C3E50;
            margin-bottom:20px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-top:15px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .btn{
            padding:10px 15px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            margin-top:20px;
        }

        .primary{
            background:#2C7A7B;
            color:white;
        }

    .back-btn {
    padding: 10px 18px;
    background-color: #2C7A7B;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-family: Arial, sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.back-btn:hover {
    background-color: #1f5e5f;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.back-btn:active {
    transform: scale(0.97);
}

    </style>
</head>

<body>

<div class="container">

    <h2>Add Supplier</h2>

    <form method="POST">

    <label>Supplier Name</label>
    <input type="text"
           name="supplier_name"
           placeholder="Enter Supplier Name">

    <label>Contact Person</label>
    <input type="text"
           name="contact_person"
           placeholder="Enter Contact Person">

    <label>Location</label>
    <input type="text"
           name="address"
           placeholder="Enter Supplier Location">

    <label>Supplied Item</label>
    <input type="text"
           name="supplied_item"
           placeholder="Enter Supplied Item">

    <label>Email</label>
    <input type="email"
           name="email"
           placeholder="Enter Supplier Email">

    <label>Phone Number</label>
    <input type="text"
           name="phone"
           placeholder="Enter Phone Number">

    <button type="submit" class="btn primary">
        Add Supplier
    </button>

</form>
</div>

<script>

function addSupplier(){

    let name =
        document.getElementById("s_name").value;

    let location =
        document.getElementById("s_location").value;
    let contact =
        document.getElementById("s_contact").value;

    let item =
        document.getElementById("s_item").value;

    let email =
        document.getElementById("s_email").value;

    let phone =
        document.getElementById("s_phone").value;

    console.log({
        supplier_name:name,
        contact_person:contact,
        location:location,
        supplied_item:item,
        email:email,
        phone:phone
    });

    alert("Supplier Added Successfully");

}

function goToDashboard() {
    window.location.href = "{{ url_for('procurement_dashboard.procurement_dashboard') }}";
}

</script>

</body>
</html>
