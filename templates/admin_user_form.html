<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | PRMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='user_login.css') }}">
    <style>
        body { min-height: 100vh; padding: 32px 16px; background: #f4f6fb; }
        .login-container { max-width: 760px; margin: 0 auto; padding: 28px; }
        h1 { margin-bottom: 20px; color: #1f2937; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        canvas { width: 100%; height: 160px; border: 1px solid #cbd5e1; background: #fff; touch-action: none; }
        .signature-actions { display: flex; justify-content: flex-end; margin-top: 6px; }
        label { font-weight: 600; }
        input, select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .actions { display: flex; gap: 12px; align-items: center; margin-top: 22px; }
        .actions button, .actions a { padding: 11px 16px; border: 0; border-radius: 4px; background: #2c7a7b; color: white; text-decoration: none; cursor: pointer; }
        .flash { margin: 0 0 14px; color: #b91c1c; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .form-group.full { grid-column: auto; } }
    </style>
</head>
<body>
<main class="login-container">
    <h1>{{ page_title }}</h1>
    {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
    <form method="post">
        <div class="form-grid">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" required minlength="3" value="{{ user.username if user else '' }}">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required value="{{ user.email if user else '' }}">
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input id="phone" name="phone" value="{{ user.phone if user and user.phone else '' }}">
            </div>
            <div class="form-group">
                <label for="user_role">Role</label>
                <select id="user_role" name="user_role" required>
                    {% if not user %}<option value="" selected disabled>-- Select role --</option>{% endif %}
                    {% for role in roles %}
                    <option value="{{ role }}" {% if user and user.user_role|lower == role %}selected{% endif %}>{{ role|title }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <select id="department" name="department">
                    <option value="">No department</option>
                    {% for department in departments %}
                    <option value="{{ department }}" {% if user and user.department == department %}selected{% endif %}>{{ department }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group full">
                <label for="password">{{ 'New password (leave blank to keep current)' if user else 'Initial password' }}</label>
                <input id="password" name="password" type="password" {% if not user %}required minlength="6"{% endif %}>
            </div>
            {% if not user %}
            <div class="form-group full">
                <label for="signaturePad">Draw signature</label>
                <canvas id="signaturePad" aria-label="Draw the new user's signature"></canvas>
                <input type="hidden" name="signature_data" id="signature_data">
                <div class="signature-actions"><button type="button" id="clearSignature">Clear signature</button></div>
            </div>
            {% endif %}
        </div>
        <div class="actions">
            <button type="submit">{{ 'Save Changes' if user else 'Create Account' }}</button>
            <a href="{{ url_for('admin_dashboard.admin_dashboard') }}">Back to users</a>
        </div>
    </form>
</main>
{% if not user %}
<script>
const signatureCanvas = document.getElementById("signaturePad");
const signatureContext = signatureCanvas.getContext("2d");
const signatureInput = document.getElementById("signature_data");
let drawing = false;

function resizeSignatureCanvas() {
    const image = signatureCanvas.toDataURL();
    signatureCanvas.width = signatureCanvas.clientWidth;
    signatureCanvas.height = 160;
    if (image !== "data:,") {
        const savedImage = new Image();
        savedImage.onload = () => signatureContext.drawImage(savedImage, 0, 0, signatureCanvas.width, signatureCanvas.height);
        savedImage.src = image;
    }
}

function pointFromEvent(event) {
    const bounds = signatureCanvas.getBoundingClientRect();
    return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
}

signatureCanvas.addEventListener("pointerdown", event => {
    drawing = true;
    signatureCanvas.setPointerCapture(event.pointerId);
    const point = pointFromEvent(event);
    signatureContext.beginPath();
    signatureContext.moveTo(point.x, point.y);
});

signatureCanvas.addEventListener("pointermove", event => {
    if (!drawing) return;
    const point = pointFromEvent(event);
    signatureContext.lineWidth = 2;
    signatureContext.lineCap = "round";
    signatureContext.strokeStyle = "#111827";
    signatureContext.lineTo(point.x, point.y);
    signatureContext.stroke();
});

signatureCanvas.addEventListener("pointerup", () => {
    drawing = false;
    signatureInput.value = signatureCanvas.toDataURL("image/png");
});

document.getElementById("clearSignature").addEventListener("click", () => {
    signatureContext.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);
    signatureInput.value = "";
});

resizeSignatureCanvas();
window.addEventListener("resize", resizeSignatureCanvas);
</script>
{% endif %}
</body>
</html>
