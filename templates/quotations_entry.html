<!DOCTYPE html>
<html>
<head>

    <title>Quotation Entry</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#eef2f7;
            padding:30px;
        }

        .container{
            max-width:1200px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h2{
            color:#2c7a7b;
            margin-bottom:20px;
            text-align:center;
        }

        h3{
            color:#2c7a7b;
            margin-top:20px;
        }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-bottom:5px;
            color:#333;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            margin-bottom:15px;
            font-size:14px;
        }

        input:focus,
        select:focus,
        textarea:focus{
            outline:none;
            border:1px solid #2c7a7b;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }

        th{
            background:#2c7a7b;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }

        button{
            padding:10px 15px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
        }

        .add{
            background:green;
            color:white;
        }

        .submit{
            background:#2c7a7b;
            color:white;
        }

        .remove{
            background:red;
            color:white;
        }

        .top-space{
            margin-top:20px;
        }

        .note{
            color:#666;
            font-size:13px;
            margin-top:-10px;
            margin-bottom:15px;
        }

        .btn-group{
            margin-top:20px;
            display:flex;
            gap:10px;
        }

        @media(max-width:768px){

            .grid{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h2>Quotation Entry Form</h2>

    <div class="grid">

        <!-- PRS -->
        <div>

            <label>PRS Number</label>

            <select id="prs_no">

                <option value="">
                    -- Select PRS --
                </option>

                {% for r in requisitions %}

                <option value="{{ r.requisition_id }}">
                    {{ r.prs_no }}
                </option>

                {% endfor %}

            </select>

        </div>

        <!-- SUPPLIER -->
        <div>

            <label>Supplier</label>

            <select id="supplier_id">

                <option value="">
                    -- Select Supplier --
                </option>

                {% for s in suppliers %}

                <option value="{{ s.supplier_id }}">
                    {{ s.supplier_name }}
                </option>

                {% endfor %}

            </select>

        </div>

        <!-- QUOTATION NUMBER -->
        <div>

            <label>Quotation Number</label>

            <input type="text"
                   id="quotation_no"
                   readonly>

        </div>

        <!-- QUOTATION DATE -->
        <div>

            <label>Quotation Date & Time</label>

            <input type="datetime-local"
                   id="quotation_date"
                   readonly>

        </div>

        <!-- DELIVERY DATE -->
        <div>

            <label>Delivery Date</label>

            <input type="date"
                   id="delivery_date">

        </div>

        <!-- PAYMENT TERMS -->
        <div>

            <label>Payment Method</label>

            <select id="payment_terms">

                <option value="">
                    -- Select Payment Method --
                </option>

                <option value="Cash">
                    Cash
                </option>

                <option value="Bank Transfer">
                    Bank Transfer
                </option>

                <option value="Mobile Money">
                    Mobile Money
                </option>

                <option value="Cheque">
                    Cheque
                </option>

            </select>

        </div>

        <!-- WARRANTY -->
        <div>

            <label>Warranty Period</label>

            <input type="number"
                   id="warranty"
                   placeholder="Enter warranty period">

            <div class="note">
                Example: 12 Months
            </div>

        </div>

        <!-- REMARKS -->
        <div>

            <label>Remarks</label>

            <textarea id="remarks"
                      rows="3"
                      placeholder="Enter remarks"></textarea>

        </div>

    </div>

    <!-- ITEMS -->
    <div class="top-space">

        <h3>Quotation Items</h3>

        <table id="itemsTable">

            <tr>
                <th>Item</th>
                <th>Description</th>
                <th>Qty</th>
                <th>Unit Price</th>
                <th>Amount</th>
                <th>Action</th>
            </tr>

        </table>

        <div class="btn-group">

            <button type="button"
                    class="add"
                    onclick="addRow()">

                + Add Item

            </button>

            <button type="button"
                    class="submit"
                    onclick="submitForm()">

                Save Quotation

            </button>

        </div>

    </div>

</div>

<script>

// =====================================
// PAGE LOAD
// =====================================
window.onload = function(){

    // CURRENT DATE TIME
    let now = new Date();

    let formatted =
        now.toISOString().slice(0,16);

    document.getElementById(
        "quotation_date"
    ).value = formatted;

    // QUOTATION NUMBER
    let year = now.getFullYear();

    let random =
        Math.floor(Math.random() * 9000) + 1000;

    document.getElementById(
        "quotation_no"
    ).value =
        "QT/" + year + "/" + random;

    // DEFAULT ONE ROW
    addRow();

};


// =====================================
// ADD ROW
// =====================================
function addRow(){

    let table =
        document.getElementById("itemsTable");

    let row =
        table.insertRow();

    row.innerHTML = `

        <td>
            <input class="item"
                   placeholder="Item name">
        </td>

        <td>
            <input class="desc"
                   placeholder="Description">
        </td>

        <td>
            <input type="number"
                   class="qty"
                   min="1"
                   oninput="calc(this)">
        </td>

        <td>
            <input type="number"
                   class="price"
                   step="0.01"
                   oninput="calc(this)">
        </td>

        <td>
            <input class="amount"
                   readonly>
        </td>

        <td>

            <button type="button"
                    class="remove"
                    onclick="removeRow(this)">

                X

            </button>

        </td>

    `;
}


// =====================================
// REMOVE ROW
// =====================================
function removeRow(btn){

    let rows =
        document.querySelectorAll(
            "#itemsTable tr"
        );

    // KEEP AT LEAST ONE ROW
    if(rows.length <= 2){

        alert(
            "At least one row is required"
        );

        return;
    }

    btn.parentElement.parentElement.remove();

}


// =====================================
// CALCULATE AMOUNT
// =====================================
function calc(input){

    let row =
        input.parentElement.parentElement;

    let qty =
        parseFloat(
            row.querySelector(".qty").value
        ) || 0;

    let price =
        parseFloat(
            row.querySelector(".price").value
        ) || 0;

    let total = qty * price;

    row.querySelector(".amount").value =
        total.toFixed(2);

}


// =====================================
// SUBMIT FORM
// =====================================
function submitForm(){

    let qrf_id =
        document.getElementById("prs_no").value;

    let supplier_id =
        document.getElementById("supplier_id").value;

    let quotation_no =
        document.getElementById("quotation_no").value;

    let quotation_date =
        document.getElementById("quotation_date").value;

    let delivery_date =
        document.getElementById("delivery_date").value;

    let payment_terms =
        document.getElementById("payment_terms").value;

    let warranty =
        document.getElementById("warranty").value + " Months";

    let remarks =
        document.getElementById("remarks").value;


    // =====================================
    // GET ITEMS
    // =====================================
    let rows =
        document.querySelectorAll(
            "#itemsTable tr:not(:first-child)"
        );

    let items = [];

    rows.forEach(row => {

        let item_name =
            row.querySelector(".item").value;

        let description =
            row.querySelector(".desc").value;

        let quantity =
            row.querySelector(".qty").value;

        let unit_price =
            row.querySelector(".price").value;

        if(item_name && quantity && unit_price){

            items.push({

                item_name:item_name,

                description:description,

                quantity:quantity,

                unit_price:unit_price

            });

        }

    });


    // =====================================
    // VALIDATION
    // =====================================
    if(
        !qrf_id ||
        !supplier_id ||
        !quotation_date ||
        !delivery_date ||
        !payment_terms
    ){

        alert(
            "Please fill all required fields"
        );

        return;
    }

    if(items.length === 0){

        alert(
            "Please add at least one item"
        );

        return;
    }


    // =====================================
    // SEND TO FLASK
    // =====================================
    fetch("/procurement/Quotation_entry", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            qrf_id:qrf_id,

            supplier_id:supplier_id,

            quotation_no:quotation_no,

            quotation_date:quotation_date,

            delivery_date:delivery_date,

            payment_terms:payment_terms,

            warranty:warranty,

            remarks:remarks,

            items:items

        })

    })

    .then(res => res.json())

    .then(data => {

        if(data.redirect){

            window.location.href =
                data.redirect;

        }else{

            alert(
                data.message ||
                "Quotation saved successfully"
            );

        }

    })

    .catch(err => {

        console.log(err);

        alert("Server Error");

    });

}

</script>

</body>
</html>
