<!DOCTYPE html>
<html>
<head>
<title>Quotation Entry</title>

<style>
body{
    font-family:Arial;
    background:#f2f6fa;
    padding:20px;
    margin:0;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input,select{
    width:100%;
    padding:8px;
    margin:5px 0 15px 0;
    box-sizing:border-box;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

button{
    padding:8px 12px;
    margin-top:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.add{ background:green; color:white; }
.submit{ background:blue; color:white; }
.remove{ background:red; color:white; }
</style>
</head>

<body>

<div class="container">

<h2>Quotation Entry Form</h2>

<!-- QRF -->
<label>Quotation Request (QRF)</label>
<select id="qrf_id" onchange="loadQRFDetails()">
    <option value="">-- Select QRF --</option>
    {% for qrf in qrfs %}
        <option value="{{ qrf.qrf_id }}">{{ qrf.qrf_no }}</option>
    {% endfor %}
</select>

<!-- Supplier -->
<label>Supplier</label>
<input type="hidden" id="supplier_id">
<input type="text" id="supplier_name" readonly>

<!-- Created By -->
<label>Created By</label>
<input type="text" value="{{ session.username }}" readonly>

<!-- Delivery Date (FINAL FIX) -->
<label>Delivery Date</label>
<input type="date" id="delivery_date">

<!-- Payment Terms -->
<label>Payment Method</label>
<select id="payment_terms">
    <option value="">-- Select Payment Method --</option>
    <option value="Cash">Cash</option>
    <option value="Bank Transfer">Bank Transfer</option>
    <option value="Mobile Money">Mobile Money</option>
    <option value="Cheque">Cheque</option>
</select>

<!-- Warranty -->
<label>Warranty</label>
<input type="text" id="warranty">

<h3>Items</h3>

<table id="itemsTable">
<tr>
    <th>Item</th>
    <th>Description</th>
    <th>Qty</th>
    <th>Unit Price</th>
    <th>Amount</th>
    <th>Action</th>
</tr>
</table>

<button class="add" type="button" onclick="addRow()">Add Item</button>
<button class="submit" type="button" onclick="submitForm()">Save Quotation</button>

</div>

<script>

// =========================
// LOAD QRF DETAILS
// =========================
function loadQRFDetails() {

    let qrf_id = document.getElementById("qrf_id").value;
    if (!qrf_id) return;

    fetch("/procurement/get_qrf_details/" + qrf_id)
    .then(res => res.json())
    .then(data => {

        document.getElementById("supplier_id").value = data.supplier_id;
        document.getElementById("supplier_name").value = data.supplier_name;

        let table = document.getElementById("itemsTable");

        while (table.rows.length > 1) {
            table.deleteRow(1);
        }

        data.items.forEach(item => {

            let row = table.insertRow();

            row.innerHTML = `
                <td><input class="item" value="${item.material_name}"></td>
                <td><input class="desc" value="${item.description}"></td>
                <td><input type="number" class="qty" value="${item.quantity}" oninput="calc(this)"></td>
                <td><input type="number" class="price" oninput="calc(this)"></td>
                <td><input class="amount" readonly></td>
                <td><button class="remove" type="button" onclick="removeRow(this)">X</button></td>
            `;
        });
    });
}

// =========================
// ADD ROW
// =========================
function addRow() {

    let table = document.getElementById("itemsTable");

    let row = table.insertRow();

    row.innerHTML = `
        <td><input class="item"></td>
        <td><input class="desc"></td>
        <td><input type="number" class="qty" oninput="calc(this)"></td>
        <td><input type="number" class="price" oninput="calc(this)"></td>
        <td><input class="amount" readonly></td>
        <td><button class="remove" type="button" onclick="removeRow(this)">X</button></td>
    `;
}

// =========================
// REMOVE ROW
// =========================
function removeRow(btn) {
    btn.closest("tr").remove();
}

// =========================
// CALCULATE AMOUNT
// =========================
function calc(input) {

    let row = input.closest("tr");

    let qty = parseFloat(row.querySelector(".qty").value) || 0;
    let price = parseFloat(row.querySelector(".price").value) || 0;

    row.querySelector(".amount").value = (qty * price).toFixed(2);
}

// =========================
// SUBMIT FORM (FINAL FIX)
// =========================
function submitForm() {

    let qrf_id = document.getElementById("qrf_id").value;
    let supplier_id = document.getElementById("supplier_id").value;
    let delivery_date = document.getElementById("delivery_date").value;
    let payment_terms = document.getElementById("payment_terms").value;
    let warranty = document.getElementById("warranty").value;

    // validation
    if (!qrf_id || !supplier_id) {
        alert("Please select QRF and Supplier");
        return;
    }

    if (!delivery_date) {
        alert("Please select delivery date");
        return;
    }

    let items = [];

    document.querySelectorAll("#itemsTable tr:not(:first-child)")
    .forEach(row => {

        let item_name = row.querySelector(".item").value;
        let description = row.querySelector(".desc").value;
        let quantity = row.querySelector(".qty").value;
        let unit_price = row.querySelector(".price").value;

        if (item_name && quantity && unit_price) {
            items.push({
                item_name,
                description,
                quantity,
                unit_price
            });
        }
    });

    if (items.length === 0) {
        alert("Please add at least one item");
        return;
    }

    fetch("/procurement/Quotation_entry", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            qrf_id,
            supplier_id,
            delivery_date,   // ✅ FIXED
            payment_terms,
            warranty,
            items
        })
    })

    .then(res => res.json())
    .then(data => {

        if (data.success) {
            alert(data.message);
            window.location.href = data.redirect;
        } else {
            alert(data.message);
        }

    })
    .catch(err => {
        console.log(err);
        alert("Server error");
    });
}

</script>

</body>
</html>
