<!DOCTYPE html>
<html>
<head>
    <title>Quotation Entry</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f6fa;
            padding:20px;
        }

        .container{
            max-width:1100px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        input,select{
            width:100%;
            padding:8px;
            margin:5px 0 15px 0;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:15px;
        }

        th,td{
            border:1px solid #ddd;
            padding:8px;
            text-align:center;
        }

        button{
            padding:8px 12px;
            margin-top:10px;
            cursor:pointer;
            border:none;
            border-radius:5px;
        }

        .add{
            background:green;
            color:white;
        }

        .submit{
            background:blue;
            color:white;
        }

        .remove{
            background:red;
            color:white;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Quotation Entry Form</h2>

    <!-- PRS -->
    <label>PRS Number</label>

    <select id="prs_no" required>

        <option value="">-- Select PRS --</option>

        {% for r in requisitions %}

            <option value="{{ r.requisition_id }}">
                {{ r.prs_no }}
            </option>

        {% endfor %}

    </select>

    <!-- SUPPLIER -->
    <label>Supplier</label>

    <select id="supplier_id" required>

        <option value="">-- Select Supplier --</option>

        {% for s in suppliers %}

            <option value="{{ s.supplier_id }}">
                {{ s.supplier_name }}
            </option>

        {% endfor %}

    </select>

    <!-- QUOTATION NUMBER -->
    <label>Quotation Number</label>

    <input type="text"
           id="quotation_no"
           readonly>

    <!-- QUOTATION DATE -->
    <label>Quotation Date</label>

    <input type="date" id="quotation_date">

    <!-- DELIVERY DATE -->
    <label>Delivery Date</label>

    <input type="date" id="delivery_date">

    <!-- PAYMENT METHOD -->
    <label>Payment Method</label>

    <select id="payment_terms">

        <option value="">-- Select Payment Method --</option>

        <option value="Cash">
            Cash
        </option>

        <option value="Bank Transfer">
            Bank Transfer
        </option>

        <option value="Mobile Money">
            Mobile Money
        </option>

        <option value="Cheque">
            Cheque
        </option>

    </select>

    <!-- WARRANTY -->
    <label>Warranty</label>

    <input type="text" id="warranty">

    <!-- REMARKS -->
    <label>Remarks</label>

    <input type="text" id="remarks">

    <!-- ITEMS -->
    <h3>Items</h3>

    <table id="itemsTable">

        <tr>
            <th>Item</th>
            <th>Description</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Amount</th>
            <th>Action</th>
        </tr>

    </table>

    <button type="button"
            class="add"
            onclick="addRow()">

        Add Item

    </button>

    <button type="button"
            class="submit"
            onclick="submitForm()">

        Save Quotation

    </button>

</div>

<script>

// ===========================
// AUTO GENERATE QUOTATION NO
// ===========================
window.onload = function(){

    let random =
        Math.floor(Math.random() * 9000) + 1000;

    document.getElementById("quotation_no").value =
        "QT-" + random;

};


// ===========================
// ADD ITEM ROW
// ===========================
function addRow(){

    let table =
        document.getElementById("itemsTable");

    let row = table.insertRow();

    row.innerHTML = `

        <td>
            <input class="item">
        </td>

        <td>
            <input class="desc">
        </td>

        <td>
            <input type="number"
                   class="qty"
                   oninput="calc(this)">
        </td>

        <td>
            <input type="number"
                   class="price"
                   step="0.01"
                   oninput="calc(this)">
        </td>

        <td>
            <input class="amount" readonly>
        </td>

        <td>
            <button type="button"
                    class="remove"
                    onclick="removeRow(this)">
                X
            </button>
        </td>

    `;
}


// ===========================
// REMOVE ROW
// ===========================
function removeRow(btn){

    btn.parentElement.parentElement.remove();

}


// ===========================
// CALCULATE AMOUNT
// ===========================
function calc(input){

    let row =
        input.parentElement.parentElement;

    let qty =
        parseFloat(
            row.querySelector(".qty").value
        ) || 0;

    let price =
        parseFloat(
            row.querySelector(".price").value
        ) || 0;

    row.querySelector(".amount").value =
        (qty * price).toFixed(2);

}


// ===========================
// SUBMIT FORM
// ===========================
function submitForm(){

    let qrf_id =
        document.getElementById("prs_no").value;

    let supplier_id =
        document.getElementById("supplier_id").value;

    let quotation_no =
        document.getElementById("quotation_no").value;

    let quotation_date =
        document.getElementById("quotation_date").value;

    let delivery_date =
        document.getElementById("delivery_date").value;

    let payment_terms =
        document.getElementById("payment_terms").value;

    let warranty =
        document.getElementById("warranty").value;

    let remarks =
        document.getElementById("remarks").value;


    // ===========================
    // GET ITEMS
    // ===========================
    let rows =
        document.querySelectorAll(
            "#itemsTable tr:not(:first-child)"
        );

    let items = [];

    rows.forEach(row => {

        let item_name =
            row.querySelector(".item").value;

        let description =
            row.querySelector(".desc").value;

        let quantity =
            row.querySelector(".qty").value;

        let unit_price =
            row.querySelector(".price").value;

        if(item_name && quantity && unit_price){

            items.push({

                item_name:item_name,
                description:description,
                quantity:quantity,
                unit_price:unit_price

            });

        }

    });


    // ===========================
    // VALIDATION
    // ===========================
    if(
        !qrf_id ||
        !supplier_id ||
        !quotation_date ||
        !delivery_date ||
        !payment_terms
    ){

        alert("Please fill all required fields");

        return;
    }

    if(items.length === 0){

        alert("Please add at least one item");

        return;
    }


    // ===========================
    // SEND TO FLASK
    // ===========================
    fetch("/procurement/Quotation_entry", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            qrf_id:qrf_id,
            supplier_id:supplier_id,

            quotation_no:quotation_no,
            quotation_date:quotation_date,

            delivery_date:delivery_date,

            payment_terms:payment_terms,

            warranty:warranty,
            remarks:remarks,

            items:items

        })

    })

    .then(res => res.json())

    .then(data => {

        if(data.redirect){

            window.location.href =
                data.redirect;

        }else{

            alert(
                data.message ||
                "Quotation saved successfully"
            );

        }

    })

    .catch(err => {

        console.log(err);

        alert("Server Error");

    });

}

</script>

</body>
</html>
