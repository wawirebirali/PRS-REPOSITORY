<!DOCTYPE html>
<html>
<head>
<title>Quotation Comparison</title>

<style>
body{
    font-family:Arial;
    background:#f2f6fa;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

label{
    font-weight:bold;
}

select{
    width:100%;
    padding:10px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#2c7a7b;
    color:white;
}

.best{
    background:#c6f6d5 !important;
    font-weight:bold;
}

button{
    padding:10px 20px;
    border:none;
    cursor:pointer;
    border-radius:5px;
    margin-top:15px;
}

.compare-btn{
    background:#2c7a7b;
    color:white;
}

.save-btn{
    background:#38a169;
    color:white;
}

#msg{
    display:none;
    padding:12px;
    margin-bottom:15px;
    border-radius:5px;
}

.success{
    background:#c6f6d5;
}

.error{
    background:#fed7d7;
}
</style>
</head>

<body>

<div class="container">

<h2>Quotation Comparison</h2>

<div id="msg"></div>

<label>Select PRS Number</label>

<select id="prsSelect" onchange="loadPRSQuotations()">
    <option value="">-- Select PRS --</option>
    {% for r in requisitions %}
        <option value="{{ r.requisition_id }}">
            {{ r.prs_no }}
        </option>
    {% endfor %}
</select>

<table>
<thead>
<tr>
    <th>Quotation No</th>
    <th>Supplier</th>
    <th>Total Amount</th>
    <th>Delivery Days</th>
    <th>Warranty</th>
</tr>
</thead>

<tbody id="quoteBody"></tbody>

</table>

<button class="compare-btn" onclick="compareQuotes()">
    Compare Quotations
</button>

<button class="save-btn" onclick="saveSelectedSupplier()">
    Save Selected Supplier
</button>

</div>

<script>

let currentPRS = null;

// ================= MESSAGE =================
function showMsg(text, type){

    let msg = document.getElementById("msg");

    msg.style.display = "block";
    msg.className = type;
    msg.innerText = text;

    setTimeout(()=>{
        msg.style.display = "none";
    },3000);
}


// ================= LOAD QUOTATIONS =================
function loadPRSQuotations(){

    let prsId = document.getElementById("prsSelect").value;
    currentPRS = prsId;

    let tbody = document.getElementById("quoteBody");
    tbody.innerHTML = "";

    if(!prsId){
        showMsg("Please select PRS", "error");
        return;
    }

    fetch(`/procurement/get_prs_quotations/${prsId}`)
    .then(res => res.json())
    .then(result => {

        if(!result || result.status !== "success" || result.data.length === 0){

            tbody.innerHTML = `
                <tr>
                    <td colspan="5">No quotations found</td>
                </tr>
            `;

            showMsg("No quotations found", "error");
            return;
        }

        result.data.forEach(q => {

            let row = document.createElement("tr");

            row.innerHTML = `
                <td class="quotation_no">${q.quotation_no}</td>
                <td class="supplier">${q.supplier_name}</td>
                <td class="amount">${q.total_amount}</td>
                <td class="delivery">${q.delivery_date || '-'}</td>
                <td class="warranty">${q.warranty || '-'}</td>

                <td class="quotation_id" style="display:none">
                    ${q.quotation_id}
                </td>
            `;

            tbody.appendChild(row);
        });

        showMsg("Quotations loaded", "success");
    })
    .catch(err => {
        console.log(err);
        showMsg("Failed to load quotations", "error");
    });
}


// ================= COMPARE =================
function compareQuotes(){

    let rows = document.querySelectorAll("#quoteBody tr");

    if(rows.length === 0){
        showMsg("No quotations available", "error");
        return;
    }

    let bestRow = null;
    let lowest = Number.MAX_VALUE;

    rows.forEach(row => {

        row.classList.remove("best");

        let amountEl = row.querySelector(".amount");

        if(!amountEl) return;

        let amount = parseFloat(amountEl.innerText || 0);

        if(amount < lowest){
            lowest = amount;
            bestRow = row;
        }
    });

    if(bestRow){
        bestRow.classList.add("best");
        showMsg("Best supplier selected", "success");
    }
}


// ================= SAVE =================
function saveSelectedSupplier(){

    let bestRow = document.querySelector(".best");

    if(!bestRow){
        alert("Please compare quotations first.");
        return;
    }

    let quotation_id =
        bestRow.querySelector(".quotation_id").innerText;

    let supplier_name =
        bestRow.querySelector(".supplier").innerText;

    fetch("/procurement/save_best_supplier", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            prs_id: currentPRS,
            quotation_id: quotation_id,
            supplier_name: supplier_name
        })
    })
    .then(res => res.json())
    .then(data => {

        if(data.success){
            showMsg(data.message, "success");
        } else {
            showMsg(data.message, "error");
        }

    })
    .catch(err => {
        console.log(err);
        showMsg("Error saving supplier", "error");
    });
}

</script>

</body>
</html>
