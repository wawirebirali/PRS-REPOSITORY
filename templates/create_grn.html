<!DOCTYPE html>
<html>
<head>

<button class="back-btn" onclick="goToDashboard()">
    ⬅ Back to Dashboard
</button>

<title>Goods Received Note (GRN)</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#eef2f7;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:#2c7a7b;
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:6px;
    color:#333;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:15px;
    font-size:14px;
}

input:focus,
select:focus{
    outline:none;
    border:1px solid #2c7a7b;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#2c7a7b;
    color:white;
}

tr:nth-child(even){
    background:#f9f9f9;
}

button{
    padding:12px 18px;
    margin-top:20px;
    cursor:pointer;
    background:#2c7a7b;
    color:white;
    border:none;
    border-radius:6px;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    background:#225e5f;
}

.ok{
    color:green;
    font-weight:bold;
}

.partial{
    color:orange;
    font-weight:bold;
}

.rejected{
    color:red;
    font-weight:bold;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

}

.back-btn {
    padding: 10px 18px;
    background-color: #2C7A7B;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-family: Arial, sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.back-btn:hover {
    background-color: #1f5e5f;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.back-btn:active {
    transform: scale(0.97);
}

</style>

</head>

<body>

<div class="container">

<h2>Goods Received Note (GRN)</h2>

<form method="POST" action="/procurement/save_grn">

<div class="grid">

    <!-- PO NUMBER -->
    <div>

        <label>PO Number</label>

        <select name="po_id"
                id="po_id"
                required>

            <option value="">
                -- Select PO --
            </option>

            {% for po in pos %}

            <option value="{{ po.purchase_order_id }}">
                {{ po.po_number }}
            </option>

            {% endfor %}

        </select>

    </div>

    <!-- SUPPLIER -->
    <div>
    <label>Created By</label>
    <input type="text" value="{{ session.username }}" readonly>
    </div>

    <div>
    <label>Supplier</label>
    <input type="text" id="supplier_name" readonly>
    <input type="hidden" id="supplier_id">
    </div>

    </div>

    <!-- GRN NUMBER -->
    <div>

        <label>GRN Number</label>

        <input
            type="text"
            name="grn_no"
            id="grn_no"
            readonly
        >

    </div>

    <!-- DATE TIME -->
    <div>

        <label>Creation Date & Time</label>

        <input
            type="datetime-local"
            name="received_date"
            id="creation_date"
            readonly
        >

    </div>

    
    

<!-- ITEMS TABLE -->
<table id="grnTable">

<thead>

<tr>
<th>Item</th>
<th>Description</th>
<th>Ordered Qty</th>
<th>Received Qty</th>
<th>Rejected Qty</th>
<th>Remarks</th>
</tr>

</thead>

<tbody id="itemsBody">

<!-- DEFAULT ROW -->

<tr>

<td>

<input
type="text"
name="material_name[]"
placeholder="Item"
readonly
>

</td>

<td>

<input
type="text"
name="description[]"
placeholder="Description"
readonly
>

</td>

<td>

<input
type="number"
class="ordered"
name="quantity_ordered[]"
readonly
>

</td>

<td>

<input
type="number"
class="received"
name="quantity_received[]"
onkeyup="calculateRow(this)"
>

</td>

<td>

<input
type="number"
class="rejected"
name="quantity_rejected[]"
readonly
>

</td>

<td>

<span class="remark"></span>

<input
type="hidden"
class="remarkInput"
name="remarks[]"
>

</td>

</tr>

</tbody>

</table>

<button type="submit">
Save GRN
</button>

</form>

</div>

<script>

// =====================================
// PAGE INIT
// =====================================
window.onload = function(){

    generateGRN();

    setDateTime();

};


// =====================================
// DATE TIME
// =====================================
function setDateTime(){

    let now = new Date();

    let formatted =
        now.toISOString().slice(0,16);

    document.getElementById(
        "creation_date"
    ).value = formatted;
}


// =====================================
// AUTO GRN NUMBER
// =====================================
function generateGRN(){

    let now = new Date();

    let year =
        now.getFullYear();

    // RANDOM NUMBER
    let number =
        localStorage.getItem("grn_counter");

    if(!number){

        number = 1;

    }else{

        number = parseInt(number) + 1;
    }

    localStorage.setItem(
        "grn_counter",
        number
    );

    // FORMAT 0001
    let formattedNumber =
        String(number).padStart(4,'0');

    document.getElementById(
        "grn_no"
    ).value =
        `GRN/${year}/${formattedNumber}`;
}


// =====================================
// LOAD PO ITEMS
// =====================================
document.getElementById("po_id")
.addEventListener("change", function(){

    let po_id = this.value;

    if(!po_id){

        return;
    }

    fetch("/procurement/get_po_items/" + po_id)

    .then(res => res.json())

    .then(data => {

        document.getElementById("supplier_id").value = data.supplier_id || "";
        document.getElementById("supplier_name").value = data.supplier_name || "";

        let body =
            document.getElementById(
                "itemsBody"
            );

        body.innerHTML = "";

        data.items.forEach(item => {

            let row = `

            <tr>

                <!-- ITEM -->
                <td>

                    <input
                        type="text"
                        name="material_name[]"
                        value="${item.item_name}"
                        readonly
                    >

                </td>

                <!-- DESCRIPTION -->
                <td>

                    <input
                        type="text"
                        name="description[]"
                        value="${item.description || ''}"
                        readonly
                    >

                </td>

                <!-- ORDERED -->
                <td>

                    <input
                        type="number"
                        class="ordered"
                        name="quantity_ordered[]"
                        value="${item.quantity}"
                        readonly
                    >

                </td>

                <!-- RECEIVED -->
                <td>

                    <input
                        type="number"
                        class="received"
                        name="quantity_received[]"
                        onkeyup="calculateRow(this)"
                        required
                    >

                </td>

                <!-- REJECTED -->
                <td>

                    <input
                        type="number"
                        class="rejected"
                        name="quantity_rejected[]"
                        readonly
                    >

                </td>

                <!-- REMARK -->
                <td>

                    <span class="remark"></span>

                    <input
                        type="hidden"
                        class="remarkInput"
                        name="remarks[]"
                    >

                </td>

            </tr>

            `;

            body.innerHTML += row;

        });

    });

});


// =====================================
// CALCULATE
// =====================================
function calculateRow(input){

    let row =
        input.closest("tr");

    let ordered =
        parseFloat(
            row.querySelector(".ordered").value
        ) || 0;

    let received =
        parseFloat(input.value) || 0;

    let rejectedField =
        row.querySelector(".rejected");

    let remarkText =
        row.querySelector(".remark");

    let remarkInput =
        row.querySelector(".remarkInput");


    // VALIDATION
    if(received > ordered){

        alert(
            "Received quantity cannot exceed ordered quantity"
        );

        input.value = "";

        rejectedField.value = "";

        remarkText.innerText = "";

        remarkInput.value = "";

        return;
    }


    // CALCULATE REJECTED
    let rejected =
        ordered - received;

    rejectedField.value =
        rejected;


    // AUTO REMARK
    if(received == ordered){

        remarkText.innerText =
            "OK";

        remarkText.className =
            "ok";

        remarkInput.value =
            "OK";
    }

    else if(received < ordered){

        remarkText.innerText =
            "PARTIAL";

        remarkText.className =
            "partial";

        remarkInput.value =
            "PARTIAL";
    }

    else{

        remarkText.innerText =
            "REJECTED";

        remarkText.className =
            "rejected";

        remarkInput.value =
            "REJECTED";
    }

}

function goToDashboard() {
    window.location.href = "{{ url_for('procurement_dashboard.procurement_dashboard') }}";
}

</script>

</body>
</html>
