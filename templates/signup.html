<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>

<link rel="stylesheet" href="{{ url_for('static', filename='user_login.css') }}">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background:linear-gradient(135deg,#eef5f7 0%,#dceff1 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.login-container{
    width:100%;
    max-width:850px;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    box-shadow:
        0 25px 60px rgba(0,0,0,0.12),
        0 8px 20px rgba(0,0,0,0.06);
}

.form-header{
    background:linear-gradient(135deg,#2C7A7B,#1f5f61);
    padding:35px;
    text-align:center;
    color:white;
}

.form-header h2{
    font-size:32px;
    margin-bottom:10px;
}

.form-header p{
    opacity:0.9;
    font-size:15px;
}

.form-content{
    padding:40px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.full-width{
    grid-column:1 / -1;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:#334155;
}

input,
select{
    width:100%;
    padding:14px 16px;
    border:1px solid #dbe2e8;
    border-radius:12px;
    background:#fafcfd;
    font-size:15px;
    transition:all .25s ease;
}

input:focus,
select:focus{
    outline:none;
    background:#fff;
    border-color:#2C7A7B;
    box-shadow:0 0 0 4px rgba(44,122,123,.15);
}

.signature-box{
    background:#fafafa;
    border:2px dashed #d4d4d4;
    border-radius:16px;
    padding:15px;
}

canvas{
    width:100%;
    height:180px;
    background:white;
    border-radius:12px;
    border:1px solid #ddd;
    cursor:crosshair;
}

.signature-actions{
    display:flex;
    justify-content:flex-end;
    margin-top:10px;
}

.clear-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.clear-btn:hover{
    background:#dc2626;
}

.submit-btn{
    width:100%;
    margin-top:25px;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#2C7A7B,#1f5f61);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(44,122,123,.3);
}

.error{
    margin-top:6px;
    color:#dc2626;
    font-size:13px;
}

.section-title{
    font-size:18px;
    font-weight:700;
    color:#1f2937;
    margin-bottom:15px;
    padding-bottom:10px;
    border-bottom:1px solid #e5e7eb;
}

@media(max-width:768px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-content{
        padding:25px;
    }

    .form-header h2{
        font-size:26px;
    }
}
</style>

</head>

<body>

<div class="login-container">

<h2>Create Account</h2>
<p class="subtitle">Fill in the details to register</p>

<form id="signupForm" method="POST" action="{{ url_for('auth.signup') }}">

<!-- USERNAME -->
<div class="form-group">
<label>Username</label>
<input type="text" name="username" required minlength="3">
</div>

<!-- EMAIL -->
<div class="form-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<!-- PASSWORD -->
<div class="form-group">
<label>Password</label>
<input type="password" id="password" name="password" required minlength="6">
</div>

<!-- CONFIRM PASSWORD -->
<div class="form-group">
<label>Confirm Password</label>
<input type="password" id="confirm_password" required>
<div id="passwordError" class="error"></div>
</div>

<!-- ROLE -->
<div class="form-group">
<label>User Role</label>
<select name="user_role" required>
<option value="">-- Select Role --</option>
<option value="employee">Employee</option>
<option value="hod">HOD</option>
<option value="procurement">Procurement</option>
<option value="finance">Finance</option>
<option value="ceo">CEO</option>
<option value="admin">Admin</option>
</select>
</div>

<!-- DEPARTMENT -->
<div class="form-group">
<label>Department</label>
<select name="department">
<option value="">-- Select Department --</option>
<option value="IT">IT</option>
<option value="Finance">Finance</option>
<option value="HR">HR</option>
<option value="Procurement">Procurement</option>
<option value="Operations">Operations</option>
<option value="Engineering">Engineering</option>
</select>
</div>

<!-- SIGNATURE (DRAWABLE) -->
<div class="form-group">
<label>Draw Your Signature</label>

<canvas id="signaturePad"></canvas>

<input type="hidden" name="signature_data" id="signature_data">

<button type="button" class="clear-btn" onclick="clearSignature()">Clear Signature</button>
</div>

<!-- SUBMIT -->
<button type="submit">Sign Up</button>

</form>

</div>

<script>

/* PASSWORD MATCH */
document.getElementById("signupForm").addEventListener("submit", function(e){

let p = document.getElementById("password").value;
let c = document.getElementById("confirm_password").value;

if(p !== c){
document.getElementById("passwordError").innerText = "Passwords do not match";
e.preventDefault();
}

});

/* SIGNATURE PAD */
let canvas = document.getElementById("signaturePad");
let ctx = canvas.getContext("2d");

function resize(){
canvas.width = canvas.offsetWidth;
canvas.height = 160;
}
resize();

let drawing = false;

canvas.addEventListener("mousedown", e=>{
drawing = true;
ctx.beginPath();
ctx.moveTo(e.offsetX, e.offsetY);
});

canvas.addEventListener("mousemove", e=>{
if(!drawing) return;
ctx.lineWidth = 2;
ctx.lineCap = "round";
ctx.strokeStyle = "#000";
ctx.lineTo(e.offsetX, e.offsetY);
ctx.stroke();
});

canvas.addEventListener("mouseup", ()=>{
drawing = false;
saveSignature();
});

canvas.addEventListener("mouseout", ()=>{
drawing = false;
});

function saveSignature(){
document.getElementById("signature_data").value = canvas.toDataURL("image/png");
}

function clearSignature(){
ctx.clearRect(0,0,canvas.width,canvas.height);
document.getElementById("signature_data").value = "";
}

/* TOUCH SUPPORT (MOBILE) */
canvas.addEventListener("touchstart", function(e){
let touch = e.touches[0];
let rect = canvas.getBoundingClientRect();
drawing = true;
ctx.beginPath();
ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
});

canvas.addEventListener("touchmove", function(e){
if(!drawing) return;
let touch = e.touches[0];
let rect = canvas.getBoundingClientRect();
ctx.lineWidth = 2;
ctx.lineCap = "round";
ctx.strokeStyle = "#000";
ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
ctx.stroke();
});

canvas.addEventListener("touchend", ()=>{
drawing = false;
saveSignature();
});

</script>

</body>
</html>
