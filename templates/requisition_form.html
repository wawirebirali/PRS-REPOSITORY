<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Purchase Requisition Slip</title>

<style>
body{
font-family:Arial, Helvetica, sans-serif;
background:#f4f6fb;
margin:0;
padding:30px;
}

.container{
max-width:1100px;
margin:auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:30px;
color:#333;
}

.top-section{
display:flex;
gap:40px;
margin-bottom:25px;
}

.field-row{
display:flex;
flex-direction:column;
flex:1;
}

label{
font-weight:bold;
margin-bottom:5px;
}

select,input{
padding:10px;
border:1px solid #ccc;
border-radius:5px;
}

.controls{
margin-bottom:15px;
}

.controls button{
background:#2C7A7B;
color:white;
border:none;
padding:10px 16px;
border-radius:5px;
cursor:pointer;
margin-right:10px;
}

.controls button:hover{
background:#1f5f61;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:25px;
}

th{
background:#2C7A7B;
color:white;
padding:10px;
text-align:left;
}

td{
border-bottom:1px solid #ddd;
padding:8px;
}

td input{
width:100%;
padding:6px;
border:1px solid #ccc;
border-radius:4px;
}

.submit-btn{
background:#2C7A7B;
color:white;
padding:12px 20px;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
display:block;
margin:auto;
}

.submit-btn:hover{
background:#1f5f61;
}
</style>

</head>

<body>

<form class="container" method="POST" action="{{ url_for('requisition.submit_requisition') }}">

<h1>Purchase Requisition Slip</h1>

<!-- TOP SECTION -->
<div class="top-section">

<div class="field-row">
<label>Department</label>

<select name="department_id" required>
<option value="">-- Select Department --</option>

{% for dept in departments %}
<option value="{{ dept.department_id }}">
{{ dept.department_name }}
</option>
{% endfor %}

</select>
</div>

<div class="field-row">
    <label>Created By</label>

    <select name="user_id" required>
        <option value="">-- Select User --</option>

        {% for user in users %}
        <option value="{{ user.user_id }}">
            {{ user.username }}
        </option>
        {% endfor %}

    </select>
</div>

<div class="field-row">
<label>Date</label>
<input type="date" id="submission_date" name="submission_date" required>
</div>

</div>

<!-- CONTROLS -->
<div class="controls">
<button type="button" onclick="addRow()">+ Add Row</button>
<button type="button" onclick="removeRow()">- Remove Row</button>
</div>

<!-- TABLE -->
<table id="reqTable">
<thead>
<tr>
<th>No</th>
<th>Material Name</th>
<th>Description</th>
<th>UOM</th>
<th>Qty Stock</th>
<th>Qty Required</th>
<th>Required Date</th>
<th>Remark</th>
</tr>
</thead>

<tbody></tbody>
</table>

<button type="submit" class="submit-btn">
Submit Requisition
</button>

</form>

<script>

let rowIndex = 0;

/* SET DATE AUTOMATICALLY */
document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("submission_date").value =
    new Date().toISOString().split("T")[0];

    addRow();
});

/* ADD ROW */
function addRow() {

const tableBody = document.querySelector("#reqTable tbody");

const row = tableBody.insertRow();

row.innerHTML = `
<td>${rowIndex + 1}</td>

<td><input type="text" name="material_name_${rowIndex}" required></td>
<td><input type="text" name="description_${rowIndex}"></td>
<td><input type="text" name="uom_${rowIndex}" required></td>
<td><input type="number" name="qty_stock_${rowIndex}" min="0"></td>
<td><input type="number" name="qty_required_${rowIndex}" min="1" required></td>
<td><input type="date" name="required_date_${rowIndex}" required></td>
<td><input type="text" name="remark_${rowIndex}"></td>
`;

rowIndex++;
}

/* REMOVE ROW */
function removeRow() {

const tableBody = document.querySelector("#reqTable tbody");

if (tableBody.rows.length > 1) {
tableBody.deleteRow(-1);
rowIndex--;
}

}
</script>

</body>
</html>
