<!DOCTYPE html>
<html>
<head>
<button class="back-btn" onclick="goToDashboard()">
    ⬅ Back to Dashboard
</button>
<title>Create Purchase Order</title>

<style>

body{
    font-family:Arial;
    background:#f2f6fa;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

h2{
    color:#2c7a7b;
}

label{
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:15px;
}

.top-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#2c7a7b;
    color:white;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.primary-btn{
    background:#2563eb;
    color:white;
}

.remove-btn{
    background:red;
    color:white;
}

.totalBox{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

/* =========================
   MODERN BUTTON SYSTEM
========================= */

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
    transition:all 0.25s ease;
    transform:translateY(0);
}

/* PRIMARY BUTTON */
.primary-btn{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    box-shadow:0 4px 10px rgba(37,99,235,0.25);
}

.primary-btn:hover{
    background:linear-gradient(135deg,#1d4ed8,#1e40af);
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(37,99,235,0.35);
}

/* REMOVE BUTTON */
.remove-btn{
    background:linear-gradient(135deg,#ef4444,#dc2626);
    color:white;
    box-shadow:0 4px 10px rgba(220,38,38,0.25);
}

.remove-btn:hover{
    background:linear-gradient(135deg,#dc2626,#991b1b);
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(220,38,38,0.35);
}

/* SECONDARY / CUSTOM BUTTON (compare suppliers) */
.btn.primary{
    background:linear-gradient(135deg,#2C7A7B,#1f5f61);
    color:white;
    box-shadow:0 4px 10px rgba(44,122,123,0.25);
}

.btn.primary:hover{
    background:linear-gradient(135deg,#1f5f61,#144e50);
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(44,122,123,0.35);
}

/* DISABLED LOOK (optional future use) */
button:disabled{
    background:#cbd5e1;
    cursor:not-allowed;
    box-shadow:none;
    transform:none;
}

/* GLOBAL HOVER FEEDBACK FOR ALL BUTTONS */
button:hover{
    filter:brightness(1.05);
}
.back-btn {
    padding: 10px 18px;
    background-color: #2C7A7B;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-family: Arial, sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.back-btn:hover {
    background-color: #1f5e5f;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.back-btn:active {
    transform: scale(0.97);
}
</style>
</head>

<body>

<div class="container">

<h2>Create Purchase Order</h2>

<div class="top-grid">

<div>
<label>PRS Number</label>
<select id="prs_number" onchange="onPrsChange()">
<option value="">-- Select PRS --</option>
</select>
</div>

<button class="btn primary"
        onclick="window.location.href='/procurement/compare_suppliers'">
    compare suppliers
</button>
</div>

<div>
<label>Supplier</label>
<input type="text" id="supplier_name" readonly>
<input type="hidden" id="supplier_id">
</div>

<div>
<label>PO Number</label>
<input type="text" id="po_number" readonly>
</div>

<div>
<label>PO Date</label>
<input type="datetime-local" id="po_date" readonly>
</div>

<div>
<label>Created By</label>
<input type="text" value="{{ session.username }}" readonly>
</div>

<div>
<label>Quotation Number</label>
<select id="qt_number" onchange="loadQuotationItems()">
<option value="">-- Select Quotation --</option>
</select>
</div>



</div>

<table id="poTable">

<tr>
<th>Item</th>
<th>Description</th>
<th>Quantity</th>
<th>Unit Price</th>
<th>Amount</th>
<th>Action</th>
</tr>

</table>

<div class="totalBox">
Total Amount :
UGX <span id="total">0.00</span>
</div>

<br>

<button class="primary-btn" onclick="submitPO()">
Create Purchase Order
</button>

</div>

<script>

let quotations = [];
let prs_id = "";

window.onload = function(){
    initPO();
    loadPrsList();
    loadQuotations();
};

// =========================
// LOAD PRS LIST
// =========================
function loadPrsList(){

    fetch(`/procurement/get_prs_list`)
    .then(res => res.json())
    .then(data => {

        let select = document.getElementById("prs_number");
        select.innerHTML = '<option value="">-- Select PRS --</option>';

        data.forEach(prs => {
            let option = document.createElement("option");
            option.value = prs.requisition_id;
            option.textContent = prs.prs_no;
            select.appendChild(option);
        });
    })
    .catch(err => {
        console.log(err);
        alert("Failed to load PRS list");
    });
}

// =========================
// PRS CHANGE
// =========================
function onPrsChange(){

    prs_id = document.getElementById("prs_number").value;
    quotations = [];

    document.getElementById("qt_number").innerHTML = '<option value="">-- Select Quotation --</option>';

    if(prs_id){
        loadQuotations();
    }
}

// =========================
// INIT PO NUMBER
// =========================
function initPO(){

    let now = new Date();

    document.getElementById("po_number").value =
        "PO/" + now.getFullYear() + "/" + Math.floor(Math.random()*100000);

    document.getElementById("po_date").value =
        now.toISOString().slice(0,16);
}

// =========================
// LOAD QUOTATIONS (FIXED)
// =========================
function loadQuotations(){

    if(!prs_id){
        return;
    }

    fetch(`/procurement/get_po_prs_quotations/${prs_id}`)

    .then(res => res.json())

    .then(data => {

        if(!data.success){
            alert(data.message);
            return;
        }

        quotations = data.data;

        let select = document.getElementById("qt_number");

        select.innerHTML = '<option value="">-- Select Quotation --</option>';

        quotations.forEach(q => {

            let option = document.createElement("option");
            option.value = q.quotation_id;
            option.textContent = q.quotation_no + " - " + q.supplier_name;

            select.appendChild(option);

        });

    })

    .catch(err => {
        console.log(err);
        alert("Failed to load quotations");
    });
}

// =========================
// ON SELECT QUOTATION
// =========================
function loadQuotationItems(){

    let id = document.getElementById("qt_number").value;

    if(!id) return;

    let q = quotations.find(x => x.quotation_id == id);

    if(!q) return;

    document.getElementById("supplier_id").value = q.supplier_id || "";
    document.getElementById("supplier_name").value = q.supplier_name;
    document.getElementById("total").innerText = Number(q.total_amount).toFixed(2);

    let table = document.getElementById("poTable");

    table.querySelectorAll("tr.data-row").forEach(row => row.remove());

    fetch(`/procurement/get_quotation_items/${id}`)
    .then(res => res.json())
    .then(items => {

        items.forEach(item => {

            let row = document.createElement("tr");
            row.className = "data-row";

            row.innerHTML = `
                <td><input type="text" value="${item.item_name || ""}" readonly></td>
                <td><input type="text" value="${item.description || ""}" readonly></td>
                <td><input type="number" class="qty" value="${item.quantity || 0}" oninput="calc(this)"></td>
                <td><input type="number" class="price" value="${item.unit_price || 0}" oninput="calc(this)"></td>
                <td><input type="number" class="amount" value="${(Number(item.quantity || 0) * Number(item.unit_price || 0)).toFixed(2)}" readonly></td>
                <td><button type="button" class="remove-btn" onclick="removeRow(this)">Remove</button></td>
            `;

            table.appendChild(row);
        });

        calculateTotal();
    })
    .catch(err => {
        console.log(err);
        alert("Failed to load quotation items");
    });
}

// =========================
// CALC ROW
// =========================
function calc(el){

    let row = el.closest("tr");

    let qty = parseFloat(row.querySelector(".qty").value) || 0;
    let price = parseFloat(row.querySelector(".price").value) || 0;

    row.querySelector(".amount").value =
        (qty * price).toFixed(2);

    calculateTotal();
}

// =========================
// TOTAL
// =========================
function calculateTotal(){

    let total = 0;

    document.querySelectorAll(".amount").forEach(el => {
        total += parseFloat(el.value) || 0;
    });

    document.getElementById("total").innerText =
        total.toFixed(2);
}

// =========================
// REMOVE ROW
// =========================
function removeRow(btn){
    btn.closest("tr").remove();
    calculateTotal();
}

// =========================
// SUBMIT PO
// =========================
function submitPO(){

    let quotation_id = document.getElementById("qt_number").value;

    if(!quotation_id){
        alert("Please select quotation");
        return;
    }

    fetch("/procurement/create_po_from_selected",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({ quotation_id })
    })

    .then(res => res.json())

    .then(data => {

        if(data.success){
            alert(
                "PO Created Successfully\n\n" +
                "PO Number: " + data.po_number +
                "\nSupplier: " + data.supplier_name
            );

            location.reload();
        }
        else{
            alert(data.message);
        }
    })

    .catch(err => {
        console.log(err);
        alert("Error creating PO");
    });
}


function goToDashboard() {
    window.location.href = "{{ url_for('procurement_dashboard.procurement_dashboard') }}";
}



</script>

</body>
</html>
