<!DOCTYPE html>
<html>
<head>

<title>Create Purchase Order</title>

<style>

body{
font-family:Arial;
background:#f2f6fa;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

input,select{
padding:8px;
width:100%;
box-sizing:border-box;
margin-bottom:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#2c7a7b;
color:white;
}

button{
padding:10px 15px;
margin-top:15px;
cursor:pointer;
background:#2c7a7b;
color:white;
border:none;
border-radius:5px;
}

.totalBox{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Create Purchase Order</h2>

<form id="poForm">

<!-- PO NUMBER -->
<label>PO Number</label>
<input type="text" id="po_number" readonly>

<!-- DATE -->
<label>Submission Date</label>
<input type="date" id="po_date" readonly>

<!-- CREATED BY -->
<label>Created By</label>
<input type="text" id="created_by" readonly>

<!-- PRS -->
<label>PRS Number</label>
<select id="prs">
<option value="">-- Select PRS --</option>
</select>

<!-- SUPPLIER -->
<label>Supplier</label>
<select id="supplier">
<option value="">-- Select Supplier --</option>
</select>

<table id="poTable">

<tr>
<th>Item</th>
<th>Description</th>
<th>Quantity</th>
<th>Unit Price</th>
<th>Amount</th>
<th>Action</th>
</tr>

</table>

<button type="button" onclick="addRow()">+ Add Item</button>

<div class="totalBox">
Total Amount: <span id="total">0.00</span>
</div>

<button type="button" onclick="submitPO()">Create Purchase Order</button>

</form>

</div>

<script>

// =========================
// INIT
// =========================
window.onload = function(){

    document.getElementById("po_number").value =
        "PO-" + Math.floor(Math.random() * 90000 + 10000);

    document.getElementById("po_date").value =
        new Date().toISOString().split("T")[0];

    // IMPORTANT: replace with Flask session user
    document.getElementById("created_by").value = "CURRENT_USER";
};


// =========================
// ADD ROW
// =========================
function addRow(){

    let table = document.getElementById("poTable");

    let row = table.insertRow();

    row.innerHTML = `
        <td><input class="item" placeholder="Item name"></td>
        <td><input class="desc" placeholder="Description"></td>

        <td>
            <input type="number" class="qty" oninput="calc(this)">
        </td>

        <td>
            <input type="number" class="price" oninput="calc(this)">
        </td>

        <td>
            <input class="amount" readonly>
        </td>

        <td>
            <button type="button" onclick="removeRow(this)">X</button>
        </td>
    `;
}


// =========================
// REMOVE ROW
// =========================
function removeRow(btn){
    btn.parentElement.parentElement.remove();
    calculateTotal();
}


// =========================
// CALCULATE ROW AMOUNT
// =========================
function calc(input){

    let row = input.parentElement.parentElement;

    let qty = parseFloat(row.querySelector(".qty").value) || 0;
    let price = parseFloat(row.querySelector(".price").value) || 0;

    let amount = qty * price;

    row.querySelector(".amount").value = amount.toFixed(2);

    calculateTotal();
}


// =========================
// TOTAL
// =========================
function calculateTotal(){

    let total = 0;

    document.querySelectorAll(".amount").forEach(a => {
        total += parseFloat(a.value) || 0;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}


// =========================
// SUBMIT PO
// =========================
function submitPO(){

    let po_number = document.getElementById("po_number").value;
    let po_date = document.getElementById("po_date").value;
    let created_by = document.getElementById("created_by").value;

    let requisition_id = document.getElementById("prs").value;
    let supplier_name = document.getElementById("supplier").value;

    if(!requisition_id || !supplier_name){
        alert("Please select PRS and Supplier");
        return;
    }

    let rows = document.querySelectorAll("#poTable tr");

    let items = [];

    rows.forEach((row, index) => {

        // skip header row
        if(index === 0) return;

        let item = row.querySelector(".item")?.value;
        let desc = row.querySelector(".desc")?.value;
        let qty = parseFloat(row.querySelector(".qty")?.value);
        let price = parseFloat(row.querySelector(".price")?.value);

        if(item && qty > 0 && price > 0){

            items.push({
                item_name: item,
                description: desc,
                quantity: qty,
                unit_price: price
            });
        }
    });

    if(items.length === 0){
        alert("Please add at least one valid item");
        return;
    }

    fetch("/procurement/create_po", {

        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            po_number,
            order_date: po_date,
            created_by,
            requisition_id,
            supplier_name,
            items
        })
    })

    .then(data => {
    if (data.success) {
        alert(data.message);

        // 🔥 THIS IS WHAT YOU ARE MISSING
        window.location.href = data.redirect;
    } else {
        alert(data.message);
    }
});
   
}

window.onload = function () {

    // PO NUMBER
    document.getElementById("po_number").value =
        "PO-" + Math.floor(Math.random() * 90000 + 10000);

    // DATE
    document.getElementById("po_date").value =
        new Date().toISOString().split("T")[0];

    // USER
    document.getElementById("created_by").value = "CURRENT_USER";

    // LOAD PRS + SUPPLIERS
    loadPRS();
    loadSuppliers();
};

function loadPRS() {

    fetch("/procurement/get_prs_list")
    .then(res => res.json())
    .then(data => {

        let select = document.getElementById("prs");

        data.forEach(prs => {

            let option = document.createElement("option");
            option.value = prs.requisition_id;
            option.textContent = prs.prs_no;

            select.appendChild(option);
        });
    });
}


function loadSuppliers() {

    fetch("/procurement/get_suppliers")
    .then(res => res.json())
    .then(data => {

        let select = document.getElementById("supplier");

        data.forEach(s => {

            let option = document.createElement("option");
            option.value = s.supplier_name;
            option.textContent = s.supplier_name;

            select.appendChild(option);
        });
    });
}


</script>

</body>
</html>
