<!DOCTYPE html>
<html>
<head>
<title>Create Purchase Order</title>

<style>
body{
    font-family:Arial;
    background:#f2f6fa;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

h2{ color:#2c7a7b; }

label{ font-weight:bold; }

input,select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
}

.top-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#2c7a7b;
    color:white;
}

button{
    padding:10px 15px;
    cursor:pointer;
    border:none;
    border-radius:6px;
}

.primary-btn{
    background:#2563eb;
    color:white;
}

.totalBox{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Create Purchase Order</h2>

<div class="top-grid">

    <div>
        <label>Quotation Number</label>
        <select id="qt_number" onchange="loadQuotationItems()">
            <option value="">-- Select Quotation --</option>
        </select>
    </div>

    <div>
        <label>PO Number</label>
        <input type="text" id="po_number" readonly>
    </div>

    <div>
        <label>PO Date</label>
        <input type="datetime-local" id="po_date" readonly>
    </div>

    <div>
        <label>Created By</label>
        <input type="text" id="created_by" value="{{ session.username }}" readonly>
    </div>

    <div>
        <label>Supplier</label>
        <input type="text" id="supplier_name" readonly>
        <input type="hidden" id="supplier_id">
    </div>

</div>

<table id="poTable">
<tr>
    <th>Item</th>
    <th>Description</th>
    <th>Quantity</th>
    <th>Unit Price</th>
    <th>Amount</th>
    <th>Action</th>
</tr>
</table>

<div class="totalBox">
Total: <span id="total">0.00</span>
</div>

<br>

<button class="primary-btn" onclick="submitPO()">
Create Purchase Order
</button>

</div>

<script>

window.onload = function(){
    initPO();
    loadQuotations();
};

function initPO(){
    let year = new Date().getFullYear();
    document.getElementById("po_number").value =
        `PO/${year}/${Math.floor(Math.random()*10000)}`;

    document.getElementById("po_date").value =
        new Date().toISOString().slice(0,16);
}

// ================= LOAD QUOTATIONS =================
function loadQuotations(){

    fetch("/procurement/get_quotation_list")
    .then(res => res.json())
    .then(data => {

        let select = document.getElementById("qt_number");
        select.innerHTML = `<option value="">-- Select Quotation --</option>`;

        data.forEach(q => {
            let opt = document.createElement("option");
            opt.value = q.quotation_id;
            opt.textContent = q.quotation_no + " - " + q.supplier_name;
            select.appendChild(opt);
        });
    });
}

// ================= LOAD ITEMS =================
function loadQuotationItems(){

    let id = document.getElementById("qt_number").value;
    if(!id) return;

    fetch(`/procurement/get_quotation_details/${id}`)
    .then(res => res.json())
    .then(data => {

        document.getElementById("supplier_id").value = data.supplier_id;
        document.getElementById("supplier_name").value = data.supplier_name;

        let table = document.getElementById("poTable");

        table.innerHTML = `
        <tr>
            <th>Item</th>
            <th>Description</th>
            <th>Quantity</th>
            <th>Unit Price</th>
            <th>Amount</th>
            <th>Action</th>
        </tr>`;

        data.items.forEach(item => {

            let row = table.insertRow();

            row.innerHTML = `
                <td><input class="item" value="${item.item_name}"></td>
                <td><input class="desc" value="${item.description}"></td>
                <td><input class="qty" value="${item.quantity}" oninput="calc(this)"></td>
                <td><input class="price" value="${item.unit_price}" oninput="calc(this)"></td>
                <td><input class="amount" readonly></td>
                <td><button onclick="removeRow(this)">X</button></td>
            `;

            calc(row.querySelector(".qty"));
        });

        calculateTotal();
    });
}

// ================= CALC =================
function calc(el){
    let row = el.closest("tr");

    let qty = parseFloat(row.querySelector(".qty").value) || 0;
    let price = parseFloat(row.querySelector(".price").value) || 0;

    row.querySelector(".amount").value = (qty * price).toFixed(2);

    calculateTotal();
}

// ================= TOTAL =================
function calculateTotal(){
    let total = 0;

    document.querySelectorAll(".amount").forEach(el => {
        total += parseFloat(el.value) || 0;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}

// ================= REMOVE =================
function removeRow(btn){
    btn.closest("tr").remove();
    calculateTotal();
}

// ================= SUBMIT PO =================
function submitPO(){

    let quotation_id = document.getElementById("qt_number").value;

    if(!quotation_id){
        alert("Select quotation first");
        return;
    }

    fetch("/procurement/create_po_from_selected", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            quotation_id: quotation_id
        })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        if(data.success){
            location.reload();
        }
    })
    .catch(err => {
        console.log(err);
        alert("Error creating PO");
    });
}

</script>

</body>
</html>
